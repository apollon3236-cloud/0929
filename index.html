<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Industry Tech News Dashboard</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1a2333;--mu:#63708a;--bd:#e0e5ee;--ac:#1f5eff}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#182030;--tx:#e8edf6;--mu:#93a0b8;--bd:#2a3550;--ac:#6b98ff}}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:24px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:24px}.sub{color:var(--mu);font-size:13px;margin-top:4px}
.bar{max-width:1100px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:5}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input{margin-left:auto;padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-width:160px}
main{max-width:1100px;margin:auto;padding:8px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tag{font-size:11px;font-weight:700;color:var(--ac)}
.card h2{margin:0;font-size:16px;line-height:1.4}
.meta{font-size:12px;color:var(--mu)}
.card ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}
.why{background:color-mix(in srgb,var(--ac) 10%,transparent);border-left:3px solid var(--ac);padding:8px 10px;font-size:13px;border-radius:4px}
.why b{display:block;font-size:11px;color:var(--ac);margin-bottom:2px}
a{color:var(--ac)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px}
footer{max-width:1100px;margin:auto;padding:0 16px 30px;font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<header><h1>🚗 Industry Tech News Dashboard</h1>
<div class="sub">자동차·제조 영업 담당자용 · 최신순 정렬 · 기준일 2026-09-29 · <span id="cnt"></span></div></header>
<div class="bar" id="bar"></div>
<main id="list"></main>

const CATS=["전체","AI","AI Robotics","Smart Factory","Cloud","Network","Cyber Security","Digital Twin"];
let cur="전체",q="";
N.sort((a,b)=>b.d.localeCompare(a.d));
const bar=document.getElementById("bar");
CATS.forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c;b.onclick=()=>{cur=c;render()};bar.appendChild(b)});
const inp=document.createElement("input");inp.placeholder="검색…";inp.oninput=e=>{q=e.target.value.toLowerCase();render()};bar.appendChild(inp);
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function render(){
 [...bar.querySelectorAll(".chip")].forEach(b=>b.classList.toggle("on",b.textContent===cur));
 const L=N.filter(n=>(cur==="전체"||n.c===cur)&&(!q||JSON.stringify(n).toLowerCase().includes(q)));
 document.getElementById("cnt").textContent=L.length+"건";
 document.getElementById("list").innerHTML=L.length?L.map(n=>`<article class="card"><div class="tag">${n.c}</div><h2>${esc(n.t)}</h2>
 <div class="meta">${esc(n.co)} · ${n.approx?"~":""}${n.d} · <a href="${n.u}" target="_blank" rel="noopener">${esc(n.s)}</a></div>
 <ul>${n.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
 <div class="why"><b>영업적으로 중요한 이유</b>${esc(n.w)}</div></article>`).join(""):'<div class="empty">결과 없음</div>';
}
render();
</script>
